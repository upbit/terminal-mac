<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>terminal-mac observer</title>
  <link rel="stylesheet" href="/observer.css">
  <script type="module" src="/observer.js"></script>
</head>
<body>
  <main>
    <div class="phone">
      <div class="screen">
        <div class="camera" aria-hidden="true"></div>
        <section class="debug-section" aria-labelledby="debug-title">
          <header class="debug-bar">
            <h1 id="debug-title">Debug</h1>
            <label class="low-bandwidth" title="Low bitrate">
              <span>Low bitrate</span>
              <input id="low-bandwidth" type="checkbox" role="switch" aria-label="Low bitrate" disabled>
              <span class="switch-track" aria-hidden="true"></span>
            </label>
          </header>
          <div class="debug">
            <div class="fps-heading">
              <span class="metric-label">FPS</span>
              <span class="fps-value"><strong id="fps">0.0</strong><span class="fps-divider">/</span><span id="fps-max">0.0</span><small>Max</small></span>
            </div>
            <div id="fps-meter" class="fps-meter" role="progressbar" aria-label="Current FPS" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0">
              <div id="fps-fill" class="fps-fill"></div>
            </div>
            <dl>
              <dt>Frame</dt><dd id="dimensions">--</dd>
              <dt>Last batch</dt><dd><span id="batch">--</span><span id="batch-detail" class="batch-detail"></span></dd>
              <dt>Draw speed</dt><dd id="timing">--</dd>
              <dt>Transfer</dt><dd id="transfer">0.0 KB/s</dd>
              <dt>Received</dt><dd id="bytes">0 B</dd>
            </dl>
            <pre id="error" role="status" hidden></pre>
          </div>
        </section>
        <section class="desktop" aria-labelledby="desktop-title">
          <header class="stream-bar">
            <span id="connection" class="connection" data-health="warning" title="Connecting">
              <span class="connection-dot" aria-hidden="true"></span><span id="status" role="status">Connecting</span>
            </span>
            <h2 id="desktop-title">MacOS</h2>
            <span id="transfer-live" class="transfer-live">0.0 KB/s</span>
          </header>
          <div class="mirror" aria-label="Guest desktop">
            <canvas id="mirror" width="640" height="400"></canvas>
            <div id="empty">Waiting for Guest</div>
          </div>
        </section>
        <div class="home" aria-hidden="true"></div>
      </div>
    </div>
  </main>
</body>
</html>
